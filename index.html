<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="透明時刻 Clear Moment：2026 和泰 AI 黑客松提案互動 Demo（非官方示意）。">
<title>透明時刻 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout：上方導覽列＋步驟說明卡（含操作按鈕），下方左為服務廠平板、右為車主手機。
   窄螢幕一次只顯示一台裝置並自動切換，操作按鈕固定在底部。紫色＝本提案新增的 AI 功能。 */
:root{
  --bg:#eef0f4; --fg:#15171c; --muted:#5a606c; --panel:#ffffff; --panel-2:#e3e6ec; --line:#d3d7df;
  --prop:#6a3fd1; --prop-soft:#efe8ff; --prop-ink:#4a28a3; --ok:#1b7f45; --ok-soft:#e2f4e9; --accent:#d6001c;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --fg:#eceef2; --muted:#a0a7b3; --panel:#1a1d23; --panel-2:#272b34; --line:#353a46;
  --prop:#a98bff; --prop-soft:#2a2142; --prop-ink:#d3c4ff; --ok:#58c98a; --ok-soft:#14301f; --accent:#ff4a5f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1115; --fg:#eceef2; --muted:#a0a7b3; --panel:#1a1d23; --panel-2:#272b34; --line:#353a46;
  --prop:#a98bff; --prop-soft:#2a2142; --prop-ink:#d3c4ff; --ok:#58c98a; --ok-soft:#14301f; --accent:#ff4a5f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--prop);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.shell{height:100%;max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:10px 16px 10px}
@media (min-width:900px){.shell{overflow:hidden}}

/* 導覽列 */
.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-weight:700;font-size:1.02rem;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:.78rem;margin-left:8px}
.chap{display:flex;gap:6px;flex-wrap:wrap}
.chap button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.chap button[aria-current="true"]{background:var(--prop);border-color:var(--prop);color:#fff;font-weight:700}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.bar{width:120px;height:6px;border-radius:9px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--prop);border-radius:9px;transition:width .3s}

/* 步驟說明卡 */
.guide{flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) auto;gap:10px 22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.g-title{display:flex;gap:12px;align-items:center;min-width:0}
.fb{flex:none;width:42px;height:42px;border-radius:12px;background:var(--prop);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem}
.g-title h2{font-size:1.1rem;line-height:1.3}
.g-title small{display:block;font-size:.74rem;color:var(--muted);margin-top:2px}
.g-mid{display:grid;gap:6px;min-width:0}
.vs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px;font-size:.8rem;line-height:1.45}
.vs b{font-size:.68rem;border-radius:4px;padding:1px 6px;align-self:start;margin-top:2px;text-align:center}
.vs .o{background:var(--panel-2);color:var(--muted)} .vs .o + span{color:var(--muted)}
.vs .n{background:var(--prop);color:#fff} .vs .n + span{font-weight:700}
.gtodo{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:7px 10px;background:var(--prop-soft);color:var(--prop-ink);font-size:.88rem;font-weight:700;line-height:1.45}
.gtodo .k{flex:none;font-size:.7rem;background:var(--prop);color:#fff;border-radius:999px;padding:1px 8px;margin-top:2px;white-space:nowrap}
.gtodo.done{background:var(--ok-soft);color:var(--ok)}
.gtodo.done .k{background:var(--ok)}
.gtodo .lost{font-weight:500;font-size:.78rem;color:var(--muted);margin-left:4px}
.acts{display:flex;flex-direction:column;gap:8px}
.acts > .gtodo{display:none}
.abtns{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700;font-size:.86rem;white-space:nowrap}
.btn.help{border-color:var(--prop);color:var(--prop-ink);background:var(--prop-soft)}
.btn.next{background:var(--prop);border-color:var(--prop);color:#fff;padding:8px 18px}
.btn.next.ready{animation:nudge 1.2s ease-in-out infinite;box-shadow:0 0 0 4px color-mix(in srgb,var(--prop) 30%,transparent)}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.btn.next.ready{animation:none}}

/* 舞台 */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px, calc((100vh - 260px) * .5), 380px);gap:16px}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;gap:5px}
.clabel{flex:none;font-size:.72rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.devtabs{display:none}
.legend{flex:none;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.72rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:20px;height:11px;border-radius:3px;display:inline-block}
.sw.old{background:#d9dce2;border:1px solid #c3c7cf}
.sw.new{background:#fff;border:2px solid #6a3fd1}

/* 中等寬度：說明卡改成兩列（標題＋按鈕／現行與提案＋請操作） */
@media (min-width:900px) and (max-width:1199px){
  .guide{grid-template-columns:minmax(0,1fr) auto}
  .g-mid{grid-column:1 / -1;grid-row:2;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;gap:6px 16px}
}
/* 窄螢幕：一次一台裝置，按鈕固定在底部 */
@media (max-width:899px){
  html{scroll-padding-top:44px;scroll-padding-bottom:calc(var(--barH, 130px) + 8px)}
  .shell{height:auto;padding:10px 12px calc(var(--barH, 130px) + 14px);gap:10px}
  .prog{margin-left:0;width:100%}
  .bar{flex:1}
  .guide{grid-template-columns:minmax(0,1fr);gap:8px;padding:12px}
  .g-mid > .gtodo{display:none}
  .acts{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px))}
  .acts > .gtodo{display:flex;font-size:.84rem;padding:6px 10px}
  .abtns .btn{flex:1;padding:10px 6px}
  .stage{grid-template-columns:minmax(0,1fr)}
  .devtabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .devtabs button{border:none;background:none;padding:9px 6px;font-weight:700;font-size:.84rem;color:var(--muted);position:relative}
  .devtabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
  .devtabs .badge{position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .devtabs button.tgt{color:var(--prop-ink);background:var(--prop-soft);animation:pulse 1.3s ease-in-out infinite;outline:2px solid #8b5cf6;outline-offset:-3px;border-radius:12px}
  .stage[data-view="owner"] .col-staff,.stage[data-view="staff"] .col-owner{display:none}
  .clabel{display:none}
  .legend{display:none}
}

/* ===== 開場／結尾 ===== */
.modal{position:fixed;inset:0;z-index:40;background:rgba(15,17,21,.55);display:grid;padding:16px;overflow-y:auto;overscroll-behavior:contain}
.mcard{margin:auto;background:var(--panel);color:var(--fg);border-radius:18px;max-width:760px;width:100%;padding:24px 24px 20px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mcard .eyebrow{font-size:.78rem;font-weight:700;color:var(--prop-ink);letter-spacing:.04em}
.mcard h1{font-size:1.7rem;line-height:1.25}
.mcard .lead{font-size:.95rem;color:var(--muted);max-width:60ch}
.fcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){
  .fcards{grid-template-columns:minmax(0,1fr);gap:8px}
  .fcard{grid-template-columns:28px minmax(0,1fr);column-gap:10px;padding:10px 12px}
  .fcard .n{grid-row:span 3}
  .mcard{padding:20px 18px 0;gap:12px}
  .mcard h1{font-size:1.4rem}
  .mrow{position:sticky;bottom:0;background:var(--panel);padding:10px 0 14px}
  .mrow .btn.big{flex:1}
  .mcard .fine{padding-bottom:16px}
}
.fcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;text-align:left;background:var(--panel)}
.fcard .n{width:28px;height:28px;border-radius:8px;background:var(--prop);color:#fff;display:grid;place-items:center;font-weight:700}
.fcard b{font-size:.92rem}
.fcard span{font-size:.8rem;color:var(--muted)}
.fcard small{font-size:.72rem;color:var(--prop-ink);font-weight:700}
button.fcard:hover{border-color:var(--prop)}
.how{display:grid;gap:6px;font-size:.84rem;background:var(--prop-soft);color:var(--prop-ink);border-radius:12px;padding:10px 14px}
.how b{font-weight:700}
.mrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn.big{font-size:1rem;padding:11px 26px}
.mcard .fine{font-size:.72rem;color:var(--muted)}

/* 指標 */
.pointer{position:fixed;z-index:30;pointer-events:none;background:#6a3fd1;color:#fff;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 14px rgba(106,63,209,.4);transform:translate(-50%,-100%);margin-top:-8px}
.pointer::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:none;border-top-color:#6a3fd1}
.pointer.below{transform:translate(-50%,0);margin-top:8px}
.pointer.below::after{bottom:auto;top:-6px;border-top:none;border-bottom:6px solid #6a3fd1;border-top-color:transparent}
.pointer.look{background:#1b7f45}
.pointer.look::after{border-top-color:#1b7f45}
.pointer.look.below::after{border-bottom-color:#1b7f45;border-top-color:transparent}

/* ===== 裝置共用（固定淺色） ===== */
.device{--r:#e50012;--r2:#c4000f;--rs:#fdecee;--ink:#1e1f22;--sub:#6e7279;--ln:#e4e5e8;--g1:#f4f5f7;--g2:#eceef1;--b1:#e6effc;--b2:#cfe0f8;--pp:#6a3fd1;
  color:var(--ink);font-family:var(--font)}
.device button{color:inherit}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pz{position:relative;z-index:2;box-shadow:0 0 0 2px var(--pp)}
.pz[data-tag]::after{content:attr(data-tag);position:absolute;top:4px;right:4px;font-size:10px;font-weight:700;line-height:1;color:#fff;background:var(--pp);border-radius:999px;padding:3px 7px;z-index:3;pointer-events:none}
.pz.lite{box-shadow:0 0 0 1.5px var(--pp)}
.tscreen,.pscreen{position:relative;isolation:isolate}
.tscreen::after,.pscreen::after{content:"";position:absolute;inset:0;background:rgba(236,238,242,.62);z-index:1;pointer-events:none}
.pulse{outline:3px solid #8b5cf6 !important;outline-offset:2px;animation:pulse 1.3s ease-in-out infinite;position:relative;z-index:3}
.pulse.look{outline-color:#1b7f45 !important;animation:none}
@keyframes pulse{0%,100%{outline-color:#8b5cf6}50%{outline-color:rgba(139,92,246,.25)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ===== 平板 ===== */
.tablet{flex:1;min-height:0;background:#2a2c31;border-radius:20px;padding:10px;display:flex}
.tscreen{flex:1;min-width:0;background:#fff;border-radius:11px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:899px){.tablet{flex:none;height:max(480px, 72vh);padding:6px;border-radius:14px}}
.tbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:8px 14px;border-bottom:1px solid var(--ln)}
.tbar .plate{font-weight:700;font-size:.92rem} .tbar .plate small{color:var(--sub);font-weight:400;font-size:.72rem}
.tbar .clock{font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.tbar .date{color:var(--sub);font-size:.78rem}
.tbar .who{margin-left:auto;color:var(--sub);font-size:.76rem;display:flex;align-items:center;gap:6px}
@media (max-width:899px){.tbar .date,.tbar .who{display:none}}
.ttabs{flex:none;display:flex;overflow-x:auto;border-bottom:1px solid var(--ln);background:#fafafa}
.ttabs button{flex:1 0 auto;border:none;background:none;padding:8px 12px;font-size:.8rem;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:5px;align-items:center;justify-content:center}
.ttabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;background:#fff}
.ttabs .dot{width:6px;height:6px;border-radius:50%;background:var(--pp)}
.tnotice{flex:none;margin:8px 12px 0;border-radius:8px;background:#fff1f3;padding:7px 100px 7px 10px;font-size:.78rem;display:grid;gap:1px}
.tnotice b{color:var(--r2)}
.tbody{flex:1;display:flex;min-height:0}
.tside{flex:none;width:60px;border-right:1px solid var(--ln);padding:8px 0;display:flex;flex-direction:column;gap:2px;align-items:center;overflow:hidden}
.tside div{display:grid;justify-items:center;gap:1px;font-size:.58rem;color:var(--sub);padding:5px 2px;width:100%;text-align:center}
.tside div.on{color:var(--ink);font-weight:700}
@media (max-width:1099px){.tside{display:none}}
.tmain{flex:1;min-width:0;overflow-y:auto;padding:12px 14px 18px;display:grid;gap:12px;align-content:start}
.trow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.fld{display:grid;gap:3px;min-width:0}
.fld>span{font-size:.7rem;color:var(--sub)}
.fakesel{border:none;border-bottom:1px solid #bbb;padding:3px 2px;min-width:110px;display:flex;justify-content:space-between;gap:10px;font-size:.86rem}
.fakesel.blue{color:#1f5fbf}
.seg{display:inline-flex;border:1px solid #333;border-radius:4px;overflow:hidden}
.seg button{border:none;background:#fff;padding:2px 10px;font-size:.78rem;border-right:1px solid #333}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:#1e1f22;color:#fff}
.uline{border:none;border-bottom:1px solid #bbb;padding:3px 2px;font:inherit;font-size:.86rem;background:transparent;color:var(--ink);min-width:0;width:100%}
.tsec{display:grid;gap:9px;padding-top:10px;border-top:1px solid var(--ln)}
.tsec h3{font-size:.86rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px 12px}
.grid label{display:grid;gap:3px;font-size:.7rem;color:var(--sub)}
.grid input,.grid select{font:inherit;font-size:.86rem;color:var(--ink);border:1px solid #c9ccd2;border-radius:6px;padding:4px 7px;background:#fff;width:100%}
.grid input.warn{border-color:var(--r);color:var(--r);font-weight:700}
.note-row{display:flex;gap:8px;align-items:stretch;background:#fff;border-radius:6px;padding:24px 6px 6px}
.note-row.pz[data-tag]::after{left:6px;right:auto}
.note-row textarea{flex:1;min-width:0;font:inherit;font-size:.84rem;color:var(--ink);border:1px solid #c9ccd2;border-radius:6px;padding:6px 8px;min-height:56px;resize:vertical;background:#fff}
.mic{flex:none;width:84px;border:1px solid #c9ccd2;border-radius:6px;background:#fff;display:grid;place-items:center;align-content:center;gap:2px;font-size:.7rem;color:var(--sub)}
.mic.rec{border-color:var(--r);color:var(--r);background:var(--rs)}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem}
.checks label{display:flex;gap:6px;align-items:center}
.checks input{accent-color:#1e1f22;width:15px;height:15px}
.tbtn{border:1px solid #1e1f22;background:#fff;border-radius:4px;padding:6px 12px;font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
.tbtn .ic{width:15px;height:15px}
.tbtn.dark{background:#1e1f22;color:#fff}
.tbtn.ai{background:var(--pp);border-color:var(--pp);color:#fff}
.tbtn.red{background:var(--r);border-color:var(--r);color:#fff}
.tbtn:disabled{opacity:.45;cursor:not-allowed}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.cat{border:1px solid var(--ln);border-radius:6px;padding:7px 9px;display:flex;gap:8px;align-items:center;font-size:.8rem}
.cat small{display:block;color:var(--sub);font-size:.68rem}
.cat.hit{border-color:var(--r)} .cat.hit small{color:var(--r);font-weight:700}
.carside{display:flex;justify-content:center}
.carside svg{width:100%;max-width:280px;height:auto}
.tw{overflow-x:auto}
.tt{border-collapse:collapse;width:100%;font-size:.78rem}
.tt th{background:#f3f4f6;color:var(--sub);font-weight:500;text-align:left;padding:5px 8px;white-space:nowrap}
.tt td{border-bottom:1px solid var(--ln);padding:6px 8px;white-space:nowrap}
.tt td.n{text-align:right;font-variant-numeric:tabular-nums} .tt th.n{text-align:right}
.tt tfoot td{font-weight:700;border-bottom:none}
.kind{display:inline-block;font-size:.68rem;font-weight:700;padding:0 7px;border-radius:3px;border:1px solid}
.kind.must{color:var(--r);border-color:var(--r)} .kind.reg{color:#1f5fbf;border-color:#1f5fbf} .kind.sug{color:#9a5c00;border-color:#d39b3c}
.aip{background:linear-gradient(180deg,#f7f3ff,#fff 70%);border-radius:10px;padding:11px 13px;display:grid;gap:9px}
.aip .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding-right:120px}
.aip .hd b{font-size:.88rem}
.spark{display:inline-flex;align-items:center;gap:3px;font-size:.7rem;font-weight:700;color:var(--pp);background:#ede6ff;border-radius:999px;padding:1px 8px}
.spark .ic{width:12px;height:12px}
.aip .desc{font-size:.76rem;color:var(--sub)}
.prev{display:grid;gap:5px}
.prev>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;align-items:start;font-size:.78rem;background:#fff;border:1px solid var(--ln);border-radius:6px;padding:5px 8px}
.prev p{grid-column:2;color:var(--sub);font-size:.74rem}
.st{font-size:.76rem;border-radius:6px;padding:5px 10px;background:var(--g1);color:var(--sub)}
.st.ok{background:#e3f4e9;color:#1b7f45} .st.warn{background:#fff3dc;color:#8a5300}
.thinking::after{content:"";display:inline-block;width:1.3em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"．"}50%{content:"．．"}75%{content:"．．．"}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none;content:"…"}}
.ptl{list-style:none;margin:0;padding:0;display:grid}
.ptl li{display:grid;grid-template-columns:44px 14px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.8rem;padding:4px 0;border-bottom:1px dashed var(--ln)}
.ptl time{font-variant-numeric:tabular-nums;color:var(--sub);font-size:.74rem}
.ptl .d{width:10px;height:10px;border-radius:50%;background:#c8ccd3}
.ptl li.done .d{background:#1b7f45} .ptl li.now .d{background:var(--r);box-shadow:0 0 0 4px var(--rs)} .ptl li.now span{font-weight:700} .ptl li.todo span{color:var(--sub)}

  const el = document.createElement(tag);
  if (a) for (const [k,v] of Object.entries(a)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "style") el.setAttribute("style", v);

      h("div",{class:"fcards"}, [[1,"AI 維修翻譯官","把專業術語翻成車主聽得懂的話，看不懂可以直接問",1],[2,"智慧客休體驗","等待時看得到進度、車況圖解與個人化用車知識",4],[3,"個人化售後關懷","交車後自動整理摘要、關懷提醒，一鍵預約下次保養",7]].map(([n,t,d,idx])=>
        h("button",{class:"fcard", onclick:()=>goScene(idx)}, h("span",{class:"n"}, NUM[n]), h("b",null,t), h("span",null,d), h("small",null,"直接看這個功能 →")))),
      h("div",{class:"how"}, h("span",null, h("b",null,"怎麼看："), "跟著畫面上紫色的「點這裡」操作，或按「幫我點一下」；做完按「下一步」。"),
        h("span",null, h("b",null,"畫面說明："), "紫框＋「提案」標籤是我們新增的 AI 功能；淡灰色是和泰現有系統（示意）。")),
      h("div",{class:"mrow"}, h("button",{class:"btn next big", id:"startBtn", onclick:()=>goScene(1)},"開始體驗 ▶")),
      h("p",{class:"fine"},"非官方示意；車輛、報價與服務據點皆為虛構；AI 內容為預先寫好的示範文字。")))];
  }
  return [h("div",{class:"modal",role:"dialog","aria-modal":"true","aria-labelledby":"et"}, h("div",{class:"mcard"},
    h("span",{class:"eyebrow"},"體驗完成"),
    h("h1",{id:"et"},"三個功能，嵌進三個現有系統"),
    h("div",{class:"fcards"}, [[1,"AI 維修翻譯官","平板工單＋官方 LINE：說明聽得懂、問得到，複雜問題轉專員",1],[2,"智慧客休體驗","My TOYOTA App：等待時看懂自己的車",4],[3,"個人化售後關懷","App 保修紀錄＋官方 LINE：離廠後服務不斷線",7]].map(([n,t,d,idx])=>
      h("button",{class:"fcard", onclick:()=>goScene(idx)}, h("span",{class:"n"}, NUM[n]), h("b",null,t), h("span",null,d), h("small",null,"再看一次 →")))),
    h("p",{class:"lead"},"車主不用多裝 App、專員不用學新系統，落地門檻低。"),
    h("div",{class:"mrow"}, h("button",{class:"btn next big", onclick:restart},"重新開始"), h("button",{class:"btn", onclick:()=>goScene(LAST-1)},"← 回到上一步"))))];
}
function devTabs(){
  return [["staff","服務專員的平板"],["owner","車主的手機"]].map(([k,l])=>h("button",{"data-dev":k,"aria-pressed":S.view===k?"true":"false", onclick:()=>{ S.view=k; render(); }}, l,
    (k==="owner" && S.view!=="owner" && (S.unread.line||S.unread.app)) ? h("span",{class:"badge"}) : null));
}
const narrow = window.matchMedia("(max-width: 899px)");
function placePointer(){
  const pt = document.getElementById("pointer");
  const el = document.querySelector(".pulse");
  if (!el || SCENES[S.scene].overlay){ pt.hidden = true; return; }
  const r = el.getBoundingClientRect();
  const limit = innerHeight - (narrow.matches ? ((document.getElementById("acts")||{}).offsetHeight || 0) : 0);
  if (r.width === 0 || r.bottom < 0 || r.top > limit - 10){ pt.hidden = true; return; }
  const info = targetInfo();
  pt.textContent = info.look ? "結果在這裡" : "點這裡";
  pt.className = "pointer" + (info.look ? " look" : "") + (r.top < 70 ? " below" : "");
  const x = Math.max(60, Math.min(innerWidth - 60, r.left + Math.min(r.width/2, 120)));
  pt.style.left = x + "px"; pt.style.top = (r.top < 70 ? r.bottom : r.top) + "px";
  pt.hidden = false;
}
function render(){
  if (S.phone.app==="app" && S.phone.page==="detail" && S.care) S.viewedRecord = true;
  const feed = document.getElementById("feed"); const keep = feed ? feed.scrollTop : null;
  const tm = document.getElementById("tmain"); const keepT = tm ? tm.scrollTop : null;
  const active = document.activeElement && document.activeElement.id;
  const real = SCENES[S.scene].overlay ? (S.scene===0 ? 0 : REAL) : S.scene;
  document.getElementById("count").textContent = SCENES[S.scene].overlay ? (S.scene===0 ? "開始" : "完成") : `步驟 ${real} / ${REAL}`;
  document.getElementById("barI").style.width = Math.round(real / REAL * 100) + "%";
  document.getElementById("chap").replaceChildren(...chapters());
  document.getElementById("guide").replaceChildren(...guide());
  document.getElementById("appname").textContent = S.phone.app === "line" ? "官方 LINE（示意）" : "My TOYOTA App（示意）";
  document.getElementById("tablet").replaceChildren(...tablet());
  document.getElementById("phone").replaceChildren(...phone());
  document.getElementById("modal").replaceChildren(...modal());
  const f2 = document.getElementById("feed"); if (f2 && keep != null) f2.scrollTop = keep;
  const t2 = document.getElementById("tmain"); if (t2 && keepT != null) t2.scrollTop = keepT;
  if (active === "lineInput") document.getElementById("lineInput")?.focus();
  const info = targetInfo();
  document.querySelectorAll("[data-t]").forEach(el=>{ const on = !!info.t && el.dataset.t === info.t; el.classList.toggle("pulse", on); el.classList.toggle("look", on && info.look); });
  const key = S.scene + ":" + info.t + ":" + S.phone.page + ":" + S.tab;
  const el = document.querySelector(".pulse");
  if (el && narrow.matches){ const dev = el.closest(".col-staff") ? "staff" : "owner"; if (key !== lastTarget && dev !== S.view){ S.view = dev; } }
  document.getElementById("stage").dataset.view = S.view;
  document.getElementById("devtabs").replaceChildren(...devTabs());
  let lost = "";
  if (info.t && !info.look && !el && SHOW[info.t] && !Object.values(S.busy).some(Boolean) && !S.recording) lost = "（目前畫面看不到，按「幫我點一下」帶你過去）";
  const tdev = el ? (el.closest(".col-staff") ? "staff" : "owner") : null;
  if (narrow.matches && tdev && tdev !== S.view){
    const b = document.querySelector(`#devtabs [data-dev="${tdev}"]`); if (b) b.classList.add("tgt");
    if (!info.look) lost = `（在「${tdev==="owner"?"車主的手機":"服務專員的平板"}」畫面，點上方切換）`;
  }
  if (lost) document.querySelectorAll(".gtodo:not(.done)").forEach(p=>p.lastElementChild.append(h("span",{class:"lost"}, lost)));
  const acts = document.getElementById("acts");
  if (acts && narrow.matches) document.documentElement.style.setProperty("--barH", acts.offsetHeight + "px");
  if (key !== lastTarget){ lastTarget = key; requestAnimationFrame(()=>{ const e = document.querySelector(".pulse"); if (e) reveal(e); requestAnimationFrame(placePointer); }); }
  else requestAnimationFrame(placePointer);
}
// 把要操作／要看的地方捲到畫面中：寬螢幕只捲裝置內部；窄螢幕置中，且避開底部操作列
function reveal(e){
  if (!narrow.matches){ e.scrollIntoView({block:"nearest", inline:"nearest"}); return; }
  const barH = (document.getElementById("acts")||{}).offsetHeight || 0;
  const tall = e.getBoundingClientRect().height > (innerHeight - barH) * 0.55;
  e.scrollIntoView({block: tall ? "start" : "center", inline:"nearest"});
}
function scrollFeed(){ requestAnimationFrame(()=>{ const f = document.getElementById("feed"); if (f && S.phone.app==="line" && S.phone.page==="chat"){ const p = f.querySelector(".pulse"); if (p) reveal(p); else f.scrollTop = f.scrollHeight; } requestAnimationFrame(placePointer); }); }

/* ================= 事件 ================= */
document.addEventListener("keydown", e=>{
  const tag = (e.target && e.target.tagName) || ""; if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if (["ArrowRight","PageDown"].includes(e.key)){ e.preventDefault(); goScene(S.scene+1); }
  if (["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); goScene(S.scene-1); }
});
window.addEventListener("resize", ()=>{ lastTarget = ""; render(); });
document.addEventListener("scroll", ()=>requestAnimationFrame(placePointer), true);
function fromHash(){ const k = (location.hash||"").slice(1); return SCENES.findIndex(s=>s.key===k); }
window.addEventListener("hashchange", ()=>{ const i = fromHash(); if (i >= 0 && i !== S.scene) goScene(i); });
goScene(Math.max(0, fromHash()));
</script>
</body>
</html>
