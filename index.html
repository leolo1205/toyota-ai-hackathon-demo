<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="透明時刻 Clear Moment：2026 和泰 AI 黑客松提案互動 Demo（非官方示意）">
<title>透明時刻 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout：簡報演示模式。上方場景控制與說明列（對應簡報頁碼），下方左為服務廠平板、右為車主手機。
   裝置畫面固定淺色模擬實際系統；紫色＝本提案新增的 AI 功能，聚焦模式下其餘現行介面變淡。 */
:root{
  --bg:#eceef2; --fg:#16181d; --muted:#5b616d; --panel:#ffffff; --panel-2:#e2e5ea; --line:#d3d7de;
  --prop:#6a3fd1; --prop-soft:#eee7ff; --prop-ink:#4b2aa3; --accent:#d6001c;
  --ok:#1b7f45; --ok-soft:#e1f3e8; --warn:#9a5c00; --warn-soft:#fff1d6;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101216; --fg:#eceef2; --muted:#9ba2ae; --panel:#1a1d23; --panel-2:#262a33; --line:#353a46;
  --prop:#a98bff; --prop-soft:#2a2142; --prop-ink:#cdbcff; --accent:#ff4a5f;
  --ok:#52c585; --ok-soft:#14301f; --warn:#f0aa3c; --warn-soft:#3a2b12; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101216; --fg:#eceef2; --muted:#9ba2ae; --panel:#1a1d23; --panel-2:#262a33; --line:#353a46;
  --prop:#a98bff; --prop-soft:#2a2142; --prop-ink:#cdbcff; --accent:#ff4a5f;
  --ok:#52c585; --ok-soft:#14301f; --warn:#f0aa3c; --warn-soft:#3a2b12; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--prop);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.shell{height:100%;display:flex;flex-direction:column;gap:8px;padding:10px 16px 8px}
@media (min-width:981px){.shell{overflow:hidden}}

/* 上方控制列 */
.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-weight:700;font-size:1rem;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:.78rem;margin-left:6px}
.nav{display:flex;align-items:center;gap:6px}
.nav .arrow{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 12px;font-weight:700}
.nav .arrow:disabled{opacity:.4;cursor:not-allowed}
.count{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);min-width:52px;text-align:center}
.segs{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.segs .gl{font-size:.68rem;color:var(--muted);margin:0 2px 0 6px;font-weight:700}
.segs button{width:20px;height:8px;border-radius:9px;border:none;background:var(--panel-2);padding:0}
.segs button.done{background:color-mix(in srgb,var(--prop) 45%,var(--panel-2))}
.segs button[aria-current="true"]{background:var(--prop);height:10px}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.tools label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.tools select{font:inherit;font-size:.8rem;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 6px;max-width:220px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:500;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--ok-soft);color:var(--ok)} .pill.off{background:var(--warn-soft);color:var(--warn)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}

/* 場景說明列 */
.cap{flex:none;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.25fr) minmax(0,1fr);gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
@media (max-width:1180px){.cap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .cap .r{grid-column:1/-1}}
@media (max-width:700px){.cap{grid-template-columns:minmax(0,1fr)}}
.cap .l{display:flex;gap:12px;align-items:center;min-width:0}
.fb{flex:none;width:44px;height:44px;border-radius:12px;background:var(--prop);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.25rem}
.fb.neutral{background:var(--panel-2);color:var(--fg);font-size:.8rem}
.cap h2{font-size:1.12rem;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--panel-2);color:var(--muted)}
.chip.slide{background:var(--fg);color:var(--bg)}
.chip.p{background:var(--prop-soft);color:var(--prop-ink)}
.cap .m{display:grid;gap:4px;min-width:0}
.cap .m p{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;font-size:.86rem;line-height:1.45}
.cap .m b{font-size:.72rem;border-radius:4px;padding:1px 0;text-align:center;align-self:start;margin-top:2px}
.cap .m .now b{background:var(--panel-2);color:var(--muted)}
.cap .m .now span{color:var(--muted)}
.cap .m .new b{background:var(--prop);color:#fff}
.cap .m .new span{font-weight:700}
.cap .r{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.hint{font-size:.82rem;color:var(--fg);display:flex;gap:6px}
.hint b{color:var(--prop-ink);white-space:nowrap}
.runb{border:1px solid var(--prop);background:var(--prop-soft);color:var(--prop-ink);border-radius:8px;padding:3px 12px;font-size:.8rem;font-weight:700}

/* 舞台 */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(330px, calc((100vh - 220px) * .5), 390px);gap:16px}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;gap:5px}
.label{flex:none;font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.appsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.appsw button{border:none;background:none;padding:2px 11px;font-size:.74rem;font-weight:500;color:var(--muted);position:relative;letter-spacing:0}
.appsw button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.appsw .badge{position:absolute;top:2px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.legend{flex:none;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.72rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:22px;height:12px;border-radius:3px;display:inline-block}
.sw.old{background:#d9dce2;border:1px solid #c3c7cf}
.sw.new{background:#fff;border:2px solid #6a3fd1}

/* ===== 裝置共用（固定淺色） ===== */
.device{--r:#e50012;--r2:#c4000f;--rs:#fdecee;--ink:#1e1f22;--sub:#6e7279;--ln:#e4e5e8;--g1:#f4f5f7;--g2:#eceef1;--b1:#e6effc;--b2:#cfe0f8;--pp:#6a3fd1;
  color:var(--ink);font-family:var(--font)}
.device button{color:inherit}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 提案標示 */
.pz{position:relative;z-index:2;box-shadow:0 0 0 2px var(--pp)}
.pz[data-tag]::after{content:attr(data-tag);position:absolute;top:4px;right:4px;font-size:10px;font-weight:700;line-height:1;color:#fff;background:var(--pp);border-radius:999px;padding:3px 7px;z-index:3;pointer-events:none;letter-spacing:0}
.pz.lite{box-shadow:0 0 0 1.5px var(--pp)}
.tscreen,.pscreen{position:relative;isolation:isolate}
.focus .tscreen::after,.focus .pscreen::after{content:"";position:absolute;inset:0;background:rgba(236,238,242,.68);z-index:1;pointer-events:none}
.pulse{outline:3px solid #8b5cf6 !important;outline-offset:2px;animation:pulse 1.3s ease-in-out infinite;position:relative;z-index:3}
@keyframes pulse{0%,100%{outline-color:#8b5cf6}50%{outline-color:rgba(139,92,246,.25)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ===== 平板 ===== */
.tablet{flex:1;min-height:0;background:#2a2c31;border-radius:20px;padding:10px;display:flex}
.tscreen{flex:1;min-width:0;background:#fff;border-radius:11px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:980px){.tablet{flex:none;height:660px}}
.tbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:8px 14px;border-bottom:1px solid var(--ln)}
.tbar .plate{font-weight:700;font-size:.92rem} .tbar .plate small{color:var(--sub);font-weight:400;font-size:.72rem}
.tbar .clock{font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums}
.tbar .date{color:var(--sub);font-size:.78rem}
.tbar .who{margin-left:auto;color:var(--sub);font-size:.76rem;display:flex;align-items:center;gap:6px}
.ttabs{flex:none;display:flex;overflow-x:auto;border-bottom:1px solid var(--ln);background:#fafafa}
.ttabs button{flex:1 0 auto;border:none;background:none;padding:8px 12px;font-size:.8rem;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:5px;align-items:center;justify-content:center}
.ttabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700;background:#fff}
.ttabs .dot{width:6px;height:6px;border-radius:50%;background:var(--pp)}
.tnotice{flex:none;margin:8px 12px 0;border-radius:8px;background:#fff1f3;padding:7px 100px 7px 10px;font-size:.78rem;display:grid;gap:1px}
.tnotice b{color:var(--r2)}
.tbody{flex:1;display:flex;min-height:0}
.tside{flex:none;width:60px;border-right:1px solid var(--ln);padding:8px 0;display:flex;flex-direction:column;gap:2px;align-items:center;overflow:hidden}
.tside div{display:grid;justify-items:center;gap:1px;font-size:.58rem;color:var(--sub);padding:5px 2px;width:100%;text-align:center}
.tside div.on{color:var(--ink);font-weight:700}
@media (max-width:640px){.tside{display:none}}
.tmain{flex:1;min-width:0;overflow-y:auto;padding:12px 14px 18px;display:grid;gap:12px;align-content:start}
.trow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.fld{display:grid;gap:3px;min-width:0}
.fld>span{font-size:.7rem;color:var(--sub)}
.fakesel{border:none;border-bottom:1px solid #bbb;padding:3px 2px;min-width:110px;display:flex;justify-content:space-between;gap:10px;font-size:.86rem}
.fakesel.blue{color:#1f5fbf}
.seg{display:inline-flex;border:1px solid #333;border-radius:4px;overflow:hidden}
.seg button{border:none;background:#fff;padding:2px 10px;font-size:.78rem;border-right:1px solid #333}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:#1e1f22;color:#fff}
.uline{border:none;border-bottom:1px solid #bbb;padding:3px 2px;font:inherit;font-size:.86rem;background:transparent;color:var(--ink);min-width:0;width:100%}
.tsec{display:grid;gap:9px;padding-top:10px;border-top:1px solid var(--ln)}
.tsec h3{font-size:.86rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px 12px}
.grid label{display:grid;gap:3px;font-size:.7rem;color:var(--sub)}
.grid input,.grid select{font:inherit;font-size:.86rem;color:var(--ink);border:1px solid #c9ccd2;border-radius:6px;padding:4px 7px;background:#fff;width:100%}
.grid input.warn{border-color:var(--r);color:var(--r);font-weight:700}
.note-row{display:flex;gap:8px;align-items:stretch;background:#fff;border-radius:6px;padding:24px 6px 6px}
.note-row textarea{flex:1;min-width:0;font:inherit;font-size:.84rem;color:var(--ink);border:1px solid #c9ccd2;border-radius:6px;padding:6px 8px;min-height:56px;resize:vertical;background:#fff}
.mic{flex:none;width:84px;border:1px solid #c9ccd2;border-radius:6px;background:#fff;display:grid;place-items:center;align-content:center;gap:2px;font-size:.7rem;color:var(--sub)}
.mic.rec{border-color:var(--r);color:var(--r);background:var(--rs)}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem}
.checks label{display:flex;gap:6px;align-items:center}
.checks input{accent-color:#1e1f22;width:15px;height:15px}
.tbtn{border:1px solid #1e1f22;background:#fff;border-radius:4px;padding:5px 12px;font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
.tbtn .ic{width:15px;height:15px}
.tbtn.dark{background:#1e1f22;color:#fff}
.tbtn.ai{background:var(--pp);border-color:var(--pp);color:#fff}
.tbtn.red{background:var(--r);border-color:var(--r);color:#fff}
.tbtn:disabled{opacity:.45;cursor:not-allowed}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.cat{border:1px solid var(--ln);border-radius:6px;padding:7px 9px;display:flex;gap:8px;align-items:center;font-size:.8rem}
.cat small{display:block;color:var(--sub);font-size:.68rem}
.cat.hit{border-color:var(--r)} .cat.hit small{color:var(--r);font-weight:700}
.carside{display:flex;justify-content:center}
.carside svg{width:100%;max-width:300px;height:auto}
.tw{overflow-x:auto}
.tt{border-collapse:collapse;width:100%;font-size:.78rem}
.tt th{background:#f3f4f6;color:var(--sub);font-weight:500;text-align:left;padding:5px 8px;white-space:nowrap}
.tt td{border-bottom:1px solid var(--ln);padding:6px 8px;white-space:nowrap}
.tt td.n{text-align:right;font-variant-numeric:tabular-nums} .tt th.n{text-align:right}
.tt tfoot td{font-weight:700;border-bottom:none}
.kind{display:inline-block;font-size:.68rem;font-weight:700;padding:0 7px;border-radius:3px;border:1px solid}
.kind.must{color:var(--r);border-color:var(--r)} .kind.reg{color:#1f5fbf;border-color:#1f5fbf} .kind.sug{color:#9a5c00;border-color:#d39b3c}
.aip{background:linear-gradient(180deg,#f7f3ff,#fff 70%);border-radius:10px;padding:11px 13px;display:grid;gap:9px}
.aip .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding-right:120px}
.aip .hd b{font-size:.88rem}
.spark{display:inline-flex;align-items:center;gap:3px;font-size:.7rem;font-weight:700;color:var(--pp);background:#ede6ff;border-radius:999px;padding:1px 8px}
.spark .ic{width:12px;height:12px}
.aip .desc{font-size:.76rem;color:var(--sub)}
.prev{display:grid;gap:5px}
.prev>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;align-items:start;font-size:.78rem;background:#fff;border:1px solid var(--ln);border-radius:6px;padding:5px 8px}
.prev p{grid-column:2;color:var(--sub);font-size:.74rem}
.st{font-size:.76rem;border-radius:6px;padding:5px 10px;background:var(--g1);color:var(--sub)}
.st.ok{background:#e3f4e9;color:#1b7f45} .st.warn{background:#fff3dc;color:#8a5300}
.thinking::after{content:"";display:inline-block;width:1.3em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"．"}50%{content:"．．"}75%{content:"．．．"}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none;content:"…"}}
.ptl{list-style:none;margin:0;padding:0;display:grid}
.ptl li{display:grid;grid-template-columns:44px 14px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.8rem;padding:4px 0;border-bottom:1px dashed var(--ln)}
.ptl time{font-variant-numeric:tabular-nums;color:var(--sub);font-size:.74rem}
.ptl .d{width:10px;height:10px;border-radius:50%;background:#c8ccd3}
.ptl li.done .d{background:#1b7f45} .ptl li.now .d{background:var(--r);box-shadow:0 0 0 4px var(--rs)} .ptl li.now span{font-weight:700} .ptl li.todo span{color:var(--sub)}
.photo{width:110px;height:76px;border-radius:6px;background:repeating-linear-gradient(45deg,#eceef1 0 8px,#f6f7f9 8px 16px);display:grid;place-items:center;color:var(--sub);flex:none}

/* ===== 手機 ===== */
.phone{flex:1;min-height:0;width:100%;background:#1e1f22;border-radius:36px;padding:9px;display:flex}
@media (max-width:980px){.phone{flex:none;height:720px;max-width:400px;margin:0 auto}}
.pscreen{flex:1;min-width:0;background:#fff;border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.sbar{flex:none;display:flex;justify-content:space-between;align-items:center;padding:7px 20px 3px;font-size:.76rem;font-weight:700;background:#fff}
.sbar .r{display:flex;gap:5px;align-items:center}
.sbar .demo{font-size:.58rem;font-weight:700;color:#fff;background:var(--pp);border-radius:4px;padding:0 5px}
.batt{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.batt::after{content:"";position:absolute;inset:1.5px 4px 1.5px 1.5px;background:currentColor;border-radius:1px}
.homeind{flex:none;height:16px;display:grid;place-items:center;background:#fff}
.homeind i{width:100px;height:4px;border-radius:9px;background:#1e1f22}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(30,31,34,.92);color:#fff;font-size:.76rem;padding:6px 14px;border-radius:999px;white-space:nowrap;z-index:6}
/* LINE */
.lhead{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px 7px;background:#fff;border-bottom:1px solid var(--ln)}
.lhead .nm{font-weight:700;font-size:.9rem}
.lhead .sp{margin-left:auto;display:flex;gap:10px;color:#444}
.av{width:26px;height:26px;border-radius:50%;background:var(--r);color:#fff;display:grid;place-items:center;flex:none}
.av .ic{width:15px;height:15px;stroke-width:2}
.lfeed{flex:1;overflow-y:auto;background:#8eaad6;padding:10px 9px;display:flex;flex-direction:column;gap:9px}
.lrow{display:flex;gap:6px;align-items:flex-start;max-width:100%}
.lrow.me{justify-content:flex-end}
.lb{background:#fff;border-radius:16px;padding:7px 11px;font-size:.82rem;max-width:80%;overflow-wrap:anywhere}
.lrow.me .lb{background:#8be15a}
.lb .src{display:block;font-size:.66rem;color:var(--sub);margin-top:3px}
.ltime{align-self:center;font-size:.66rem;color:#fff;background:rgba(0,0,0,.2);border-radius:999px;padding:1px 10px;text-align:center}
.ltime.pz{background:var(--pp)}
.flex{background:#fff;border-radius:16px;overflow:hidden;width:250px;max-width:calc(100% - 34px);display:grid}
.flex .hero{height:74px;background:linear-gradient(160deg,var(--b1),var(--b2));display:flex;align-items:center;justify-content:center}
.flex .hero svg{height:56px;width:auto}
.flex .bd{padding:9px 11px;display:grid;gap:5px}
.flex .pl{font-size:.66rem;color:var(--r);font-weight:700}
.flex h4{font-size:.9rem}
.flex .tx{font-size:.74rem;color:var(--sub)}
.flex .big{text-align:center;font-weight:700;font-size:1rem}
.flex .bigr{text-align:center;font-weight:700;font-size:1.5rem;color:var(--r);line-height:1.2}
.flex .kv{font-size:.7rem;color:var(--sub);display:grid;grid-template-columns:62px minmax(0,1fr);gap:1px 6px}
.flex .ft{padding:0 11px 11px;display:grid;gap:6px}
.lbtn{border:1px solid var(--r);background:var(--r);color:#fff !important;border-radius:6px;padding:6px 8px;font-size:.78rem;font-weight:700;width:100%}
.lbtn.o{background:#fff;color:var(--r) !important}
.lbtn.ai{background:var(--pp);border-color:var(--pp)}
.lbtn:disabled{background:#d9dadd;border-color:#d9dadd;color:#fff !important;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lit{display:grid;gap:2px;padding:6px 8px;border-radius:8px;background:var(--g1);font-size:.74rem}

  const tm = document.getElementById("tmain"); const keepT = tm ? tm.scrollTop : null;
  const active = document.activeElement && document.activeElement.id;
  document.getElementById("cap").replaceChildren(...caption());
  document.getElementById("segs").replaceChildren(...segs());
  document.getElementById("count").textContent = `${S.scene+1} / ${SCENES.length}`;
  document.getElementById("prev").disabled = S.scene === 0;
  document.getElementById("next").disabled = S.scene === SCENES.length-1;
  document.getElementById("jump").value = String(S.scene);
  document.getElementById("appsw").replaceChildren(...appSwitch());
  document.getElementById("tablet").replaceChildren(...tablet());
  document.getElementById("phone").replaceChildren(...phone());
  const f2 = document.getElementById("feed"); if (f2 && keep != null) f2.scrollTop = keep;
  const t2 = document.getElementById("tmain"); if (t2 && keepT != null) t2.scrollTop = keepT;
  if (active === "lineInput") document.getElementById("lineInput")?.focus();
  const tg = sceneTargets(); document.querySelectorAll("[data-t]").forEach(el=>el.classList.toggle("pulse", tg.includes(el.dataset.t)));
  const key = S.scene + ":" + tg.join(",");
  if (key !== lastPulse){ lastPulse = key; requestAnimationFrame(()=>{ const el = document.querySelector(".pulse"); if (el) el.scrollIntoView({block:"nearest", inline:"nearest"}); }); }
}
function scrollFeed(){ requestAnimationFrame(()=>{ const f = document.getElementById("feed"); if (f && S.phone.app==="line" && S.phone.page==="chat"){ const p = f.querySelector(".pulse"); if (p) p.scrollIntoView({block:"nearest"}); else f.scrollTop = f.scrollHeight; } }); }

/* ================= 事件 ================= */
const jump = document.getElementById("jump");
SCENES.forEach((sc,i)=>jump.append(h("option",{value:String(i)}, `${i+1}. ${sc.f?["","①","②","③"][sc.f]+" ":""}${sc.title}（${sc.slide}）`)));
jump.addEventListener("change", e=>goScene(+e.target.value));
document.getElementById("prev").addEventListener("click", ()=>goScene(S.scene-1));
document.getElementById("next").addEventListener("click", ()=>goScene(S.scene+1));
document.getElementById("focusT").addEventListener("change", e=>{ document.getElementById("shell").classList.toggle("focus", e.target.checked); });
document.getElementById("shell").classList.add("focus");
document.addEventListener("keydown", e=>{
  const tag = (e.target && e.target.tagName) || ""; if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if (["ArrowRight","PageDown"].includes(e.key)){ e.preventDefault(); goScene(S.scene+1); }
  if (["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); goScene(S.scene-1); }
});
function fromHash(){ const k = (location.hash||"").slice(1); const i = SCENES.findIndex(s=>s.key===k); return i; }
window.addEventListener("hashchange", ()=>{ const i = fromHash(); if (i >= 0 && i !== S.scene) goScene(i); });
goScene(Math.max(0, fromHash()));
</script>
